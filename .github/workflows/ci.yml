name: CI

# Lint, typecheck and build. No secrets: the test suite needs real Sprites and runs locally (docs/testing.md).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: The published tarball holds what it should
        run: npm pack --dry-run 2>&1 | grep -E "dist/index\.js|assets/fly-pi-lockup-light\.svg|README\.md|LICENSE"
